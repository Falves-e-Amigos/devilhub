default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  # Dados do Supabase aqui:
  host: <%= ENV['DB_HOST'] %>
  username: "postgres"
  password: <%= ENV['DB_PASSWORD'] %>
  database: "postgres"
  port: 5432

development:
  <<: *default

test:
  <<: *default

production:
  <<: *default